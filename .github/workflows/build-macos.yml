name: macOS Universal Build
on: [workflow_dispatch, push]
jobs:
 build:
  runs-on: macos-15
  steps:
   - uses: actions/checkout@v4
   - name: Configure
     run: cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
   - name: Build
     run: cmake --build build --config Release --target Even_VST3 Even_AU Even_Standalone
   - uses: actions/upload-artifact@v4
     with:
      name: Even-macOS-universal
      path: build/Even_artefacts/Release/
